<!doctype html>
<meta charset="utf-8">
<title>Серия 5 · пробные кадры</title>
<style>
@font-face{font-family:Rubik;font-weight:800;src:url(../fonts/rubik-cyrillic-800-normal.woff2)}
@font-face{font-family:Neucha;src:url(../fonts/neucha-cyrillic-400-normal.woff2)}
body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh}
</style>
<canvas id="c"></canvas>
<span style="font-family:Rubik;font-weight:800;position:absolute;opacity:0">.</span><span style="font-family:Neucha;position:absolute;opacity:0">.</span>
<script src="core.js"></script>
<script src="cast.js"></script>
<script src="sets.js"></script>
<script>
'use strict';
function frameKitchen(c) {
  kitchen(c, 0);
  at(c, 540, 1190, 1, () => tema(c, 'sit', { eyes: 'open', look: [.7, .2], mouth: 'chew', brows: 'calm' }));
  table(c);
  at(c, 290, 985, .72, () => bublik(c, 'sill'));
  label(c, 'Челябинск · 15 февраля 2013 · 9:20', CX, 130, { size: 44 });
  subtitle(c, 'Обычное утро. Мороз, школа,\nбутерброд с сыром…');
}
function frameFlash(c) {
  kitchen(c, 1);
  roomLight(c, 1);
  floorShadow(c, 520, 1500, 1);
  at(c, 520, 1010, 1.02, () => tema(c, 'back'));
  table(c, 1);
  at(c, 860, 1800, .7, () => bublik(c, 'hiss'));
  subtitle(c, '— Ого! Это надо снять!', 1600);
}
function frameCorridor(c) {
  corridor(c, 1);
  at(c, 290, 1220, 1.2, () => vera(c, 'crouch', { eyes: 'shut', mouth: 'tight', brows: 'worry' }));
  at(c, 580, 1270, 1.1, () => tema(c, 'crouch'));
  at(c, 470, 1560, .75, () => bublik(c, 'flat'));
  shards(c, 1);
  boomText(c, 'БАХ!', 820, 420);
  subtitle(c, 'Окна лопаются — но у стены\nбез окон осколки не достанут', 1700);
}
function frameSpace(c) {
  space(c, 1);
  label(c, 'ФАНТАСТИКА: А ЧТО ЕСЛИ…', CX, 140, { size: 50, bg: '#e23b3b', color: '#fff', rot: -.05 });
  subtitle(c, 'А что если летит не камешек,\nа настоящий гигант?', 1640);
}
Promise.all([document.fonts.load('800 54px Rubik','Чя')]).then(()=>defineFilm({ format: { ar: '9:16', width: 1080 }, fps: 24, timeline: [
  { name: 'kitchen', dur: 1, fn: frameKitchen }, { name: 'flash', dur: 1, fn: frameFlash },
  { name: 'corridor', dur: 1, fn: frameCorridor }, { name: 'space', dur: 1, fn: frameSpace } ] }));
</script>
