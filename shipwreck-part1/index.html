<title>Кораблекрушение. Часть 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&display=swap">
<style>
/* Layout: один вертикальный кадр 9:16 по центру, под ним панель управления. Тёмная тема задана намеренно, это кинозал. */
:root{--bg:#07090f;--panel:#111827;--fg:#e9edf5;--mute:#8b94a7;--red:#ff3b30;--gold:#ffc928;--line:#1f2937;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 'Rubik',system-ui,sans-serif;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
 display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box;overflow-x:hidden}
.stage{position:relative;aspect-ratio:9/16;width:min(100%,calc((100dvh - 96px)*0.5625));background:#000;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 24px 80px #000}
canvas{display:block;width:100%;height:100%}
.bar{position:absolute;left:0;top:0;height:3px;background:var(--red);width:0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;padding:22px 22px 34px;text-align:center;
 background:linear-gradient(to top,#000d 8%,#0000 62%)}
.cover h1{margin:0;font:900 clamp(22px,6.4cqw,34px)/1.12 'Rubik',sans-serif;text-wrap:balance;text-shadow:0 2px 14px #000}
.cover[hidden]{display:none}
.cover h1 em{font-style:normal;color:var(--red)}
.cover p{margin:0;color:#c3cad8;font-size:13px}
button{font:800 15px 'Rubik',sans-serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
button:hover{border-color:#3b4658}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.go{background:var(--red);border-color:var(--red);color:#fff;font-size:17px;padding:14px 26px;border-radius:12px}
.go:hover{background:#ff5247;border-color:#ff5247}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.note{max-width:420px;text-align:center;color:var(--mute);font-size:12.5px;margin:0}
.stage{container-type:inline-size}
</style>

<div class="stage" id="stage">
  <canvas id="cv" aria-label="Анимированный ролик «Ты выжил после авиакатастрофы. Но это только начало»"></canvas>
  <div class="bar" id="bar"></div>
  <div class="cover" id="cover">
    <h1>Ты выжил после авиакатастрофы. <em>Но это только начало.</em></h1>
    <button class="go" id="go">Смотреть со звуком</button>
    <p>2 мин 30 с · вертикальный 9:16 · лучше в наушниках</p>
  </div>
</div>
<div class="ctl">
  <button id="pp">Пауза</button>
  <button id="rs">Заново</button>
  <button id="vo">Голос: вкл</button>
</div>
<p class="note">Картинка и звук собираются прямо в браузере. Озвучку читает встроенный русский голос вашего устройства; если его нет, текст идёт субтитрами.</p>

<script>
'use strict';
/* ================= БАЗА ================= */
const W=540,H=960,DPR=2,TOTAL=150;
const cv=document.getElementById('cv');cv.width=W*DPR;cv.height=H*DPR;
const c=cv.getContext('2d');
const INK='#080a12';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=cl(x);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
const FONT="Rubik,'Arial Black',Impact,sans-serif";
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulb(11);

/* ---------- рисование ---------- */
function grad(y0,y1,st){const g=c.createLinearGradient(0,y0,0,y1);st.forEach(([o,k])=>g.addColorStop(o,k));return g}
function rect(x,y,w,h,f){c.fillStyle=f;c.fillRect(x,y,w,h)}
function path(pts,fill,stroke,lw=3){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.lineJoin='round';c.stroke()}}
function rr(x,y,w,h,r,fill,stroke,lw=3){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function circ(x,y,r,fill,stroke,lw=3){c.beginPath();c.arc(x,y,r,0,7);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function glow(x,y,r,col,a=1){c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=a;c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);c.restore()}
function withT(x,y,rot,s,fn){c.save();c.translate(x,y);c.rotate(rot||0);c.scale(s||1,s||1);fn();c.restore()}

/* ---------- декорации ---------- */
const stars=Array.from({length:70},()=>({x:R()*W,y:R()*480,r:R()*1.4+.4,p:R()*6}));
function drawStars(t,a=1){stars.forEach(s=>{c.globalAlpha=a*(.5+.5*Math.sin(t*2+s.p))*.9;circ(s.x,s.y,s.r,'#fff')});c.globalAlpha=1}

function sea(y,h,c1,c2,t,amp=6,foam=true){
 rect(0,y,W,h,grad(y,y+h,[[0,c1],[1,c2]]));
 c.lineWidth=2;
 for(let i=0;i<7;i++){const yy=y+14+i*i*3.1+i*6;c.strokeStyle=`rgba(255,255,255,${.05+i*.012})`;c.beginPath();
  for(let x=0;x<=W;x+=12){const v=yy+Math.sin(x*.02+t*(1+i*.2)+i)*amp*(.4+i*.12);x?c.lineTo(x,v):c.moveTo(x,v)}c.stroke()}
 if(foam){c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.beginPath();for(let x=0;x<=W;x+=10){const v=y+h+Math.sin(x*.03+t*1.3)*4;x?c.lineTo(x,v):c.moveTo(x,v)}c.stroke()}
}
function sand(y,c1,c2){rect(0,y,W,H-y,grad(y,H,[[0,c1],[1,c2]]));
 for(let i=0;i<60;i++){const rx=(i*97)%W,ry=y+20+((i*53)%(H-y-20));c.fillStyle='rgba(0,0,0,.07)';c.fillRect(rx,ry,6+(i%5)*3,2)}}

function palm(x,y,h,lean,t,col='#0c1a14',leaf='#14301f'){
 c.save();
 c.strokeStyle=col;c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+lean*.2,y-h*.55,x+lean,y-h);c.stroke();
 const tx=x+lean,ty=y-h;
 for(let i=0;i<8;i++){const a=-Math.PI/2+(i-3.5)*.52+Math.sin(t*1.2+i)*.04;const L=h*.5+(i%2)*14;
  const ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.5+L*.42;
  c.fillStyle=i%2?leaf:col;c.beginPath();c.moveTo(tx,ty);
  c.quadraticCurveTo(tx+Math.cos(a)*L*.55,ty+Math.sin(a)*L*.55-24,ex,ey);
  c.quadraticCurveTo(tx+Math.cos(a)*L*.5,ty+Math.sin(a)*L*.4+10,tx,ty);c.fill()}
 c.restore()}

const trunks=Array.from({length:16},(_,i)=>({x:i*36+R()*20-10,w:18+R()*34,l:R()}));
function jungle(t,glowX,glowY,glowA,dark='#04070c',lit='#0e1a22'){
 trunks.forEach(k=>{const near=1-cl(Math.abs(k.x-glowX)/380);
  rect(k.x,0,k.w,H,dark);
  c.fillStyle=lit;c.globalAlpha=.25+near*.55*glowA;c.fillRect(k.x,0,k.w*.35,H);c.globalAlpha=1});
 // листва сверху
 for(let i=0;i<9;i++){const x=i*66-10+Math.sin(t*.5+i)*5;c.fillStyle=dark;c.beginPath();c.ellipse(x,30+(i%3)*18,60,50,0,0,7);c.fill()}
 // туман
 for(let i=0;i<3;i++){const y=520+i*130;const off=(t*(8+i*5))%W;c.globalAlpha=.1;rect(-W+off,y,W*2,90,grad(y,y+90,[[0,'rgba(120,150,170,0)'],[.5,'rgba(120,150,170,1)'],[1,'rgba(120,150,170,0)']]));c.globalAlpha=1}}

function fire(x,y,s,t,a=1){
 glow(x,y-40*s,260*s,'rgba(255,120,30,.75)',a*(.75+.25*Math.sin(t*23)+.1*Math.sin(t*41)));
 c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=a;
 // поленья
 c.lineCap='round';c.strokeStyle='#2a160b';c.lineWidth=10;c.beginPath();c.moveTo(-40,4);c.lineTo(36,-6);c.moveTo(-36,-8);c.lineTo(40,6);c.stroke();
 const cols=[['#ff4a1c',1],['#ff9a2e',.7],['#fff0a0',.4]];
 cols.forEach(([col,k],i)=>{const hh=(62+Math.sin(t*14+i*2)*9+Math.sin(t*31+i)*5)*k,ww=(34+Math.sin(t*9+i)*4)*k;
  c.fillStyle=col;c.beginPath();c.moveTo(-ww,0);c.quadraticCurveTo(-ww*.9,-hh*.6,Math.sin(t*10+i)*8,-hh);c.quadraticCurveTo(ww*.9,-hh*.6,ww,0);c.closePath();c.fill()});
 for(let i=0;i<7;i++){const p=(t*.8+i*.31)%1;c.globalAlpha=a*(1-p);circ(Math.sin(i*7+t*3)*20,-30-p*130,2.2,'#ffc46b')}
 c.restore()}

function suitcase(x,y,s,col,rot){withT(x,y,rot,s,()=>{rr(-32,-22,64,44,7,col,INK,3);rr(-9,-31,18,10,4,null,INK,3);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(-26,-16,52,6);rect(-4,-22,8,44,'rgba(0,0,0,.18)')})}
function jacket(x,y,s,rot){withT(x,y,rot,s,()=>{path([[-44,-8],[-18,-30],[0,-22],[18,-30],[44,-8],[34,22],[-34,22]],'#2a5fe0',INK,3);path([[0,-22],[18,-30],[44,-8],[34,22],[0,22]],'#ffc928',INK,3);c.strokeStyle=INK;c.lineWidth=2;c.beginPath();c.moveTo(0,-22);c.lineTo(0,22);c.stroke()})}

function fuselage(x,y,w,h,rot,t,lit=1){withT(x,y,rot,1,()=>{
 const g=grad(-h/2,h/2,[[0,'#eef3fa'],[.55,'#d4dbe7'],[.56,'#1f4fd0'],[1,'#17338a']]);
 c.beginPath();c.moveTo(-w/2,-h/2+14);c.quadraticCurveTo(-w/2-30,0,-w/2,h/2-14);c.lineTo(-w/2+10,h/2);
 // рваный край справа
 const n=9;for(let i=0;i<=n;i++){const yy=h/2-i*(h/n);c.lineTo(w/2+(i%2?-16:12)+Math.sin(i*3)*6,yy)}
 c.lineTo(-w/2+10,-h/2);c.closePath();c.fillStyle=g;c.fill();c.strokeStyle=INK;c.lineWidth=4;c.lineJoin='round';c.stroke();
 rect(-w/2+6,h*.02,w-30,8,'#ffc928');
 for(let i=0;i<6;i++)rr(-w/2+34+i*38,-h*.22,17,22,8,'#243656',INK,2);
 // обгоревший край
 c.fillStyle='rgba(0,0,0,.55)';for(let i=0;i<8;i++)circ(w/2-14+Math.sin(i)*8,-h/2+i*h/8+8,12+(i%3)*4,'rgba(0,0,0,.45)');
 c.globalAlpha=1-lit;c.fillStyle='#0a1020';c.fillRect(-w/2-30,-h/2-4,w+60,h+8);c.globalAlpha=1})}

function tailFin(x,y,s,t){withT(x,y,0,s,()=>{
 path([[-34,0],[-64,-300],[-10,-300],[60,0]],'#2358e8',INK,4);
 path([[-14,-120],[-50,-190],[-26,-196],[10,-150]],'#ffc928',INK,3);
 circ(-20,-210,24,'#ffc928',INK,3);
 path([[-64,0],[-100,28],[88,28],[60,0]],'#d9e0ec',INK,3)})}

function planeSide(x,y,s,rot){withT(x,y,rot,s,()=>{
 // крыло и двигатель
 path([[0,10],[-56,96],[-22,96],[66,10]],'#b9c3d4',INK,4);rr(-4,56,56,24,11,'#8e99ad',INK,3);
 // фюзеляж
 c.beginPath();c.moveTo(-150,-22);c.lineTo(-110,-26);c.lineTo(100,-30);c.quadraticCurveTo(170,-26,176,6);c.quadraticCurveTo(160,34,100,34);c.lineTo(-110,28);c.quadraticCurveTo(-150,20,-150,-22);c.closePath();
 c.fillStyle=grad(-30,34,[[0,'#f1f5fb'],[.55,'#d3dae6'],[.56,'#2358e8'],[1,'#17338a']]);c.fill();c.strokeStyle=INK;c.lineWidth=4;c.lineJoin='round';c.stroke();
 rect(-146,4,300,7,'#ffc928');
 path([[-150,-22],[-166,-92],[-120,-92],[-80,-26]],'#2358e8',INK,4);circ(-136,-72,10,'#ffc928');
 for(let i=0;i<11;i++)circ(-90+i*20,-8,5,'#243656');
 path([[110,-26],[150,-22],[158,-8],[112,-8]],'#1b2742',INK,2)})}

/* ---------- люди ---------- */
function person(x,y,s,col,o={}){ // (x,y) — ступни
 const w=Math.sin((o.t||0)*6)*(o.walk||0);
 withT(x,y,o.rot||0,s,()=>{
  c.lineCap='round';
  rr(-14,-52+w*2,10,52,5,col,o.line);rr(4,-52-w*2,10,52,5,col,o.line);
  rr(-20,-118,40,70,14,col,o.line);
  rr(-31,-112,12,52,6,col,o.line);rr(19,-112,12,52,6,col,o.line);
  circ(0,-136,20,o.skin||col,o.line);
  if(o.hood){c.fillStyle=o.hood;c.beginPath();c.arc(0,-138,23,Math.PI*.95,Math.PI*2.05);c.fill()}
 })}
function hero(x,y,s,t,o={}){ // со спины, серая худи
 withT(x,y,0,s,()=>{
  const k=Math.sin(t*1.6)*1.2;
  rr(-15,-54,12,54,5,'#2a3142',INK,3);rr(3,-54,12,54,5,'#2a3142',INK,3);
  rr(-23,-122,46,74,16,'#7c8597',INK,3);
  rr(-35,-116+k,13,54,6,'#7c8597',INK,3);rr(22,-116-k,13,54,6,'#7c8597',INK,3);
  circ(-29,-62+k,7,'#c9a07a',INK,2);circ(29,-62-k,7,'#c9a07a',INK,2);
  circ(0,-140,22,'#7c8597',INK,3);c.fillStyle='#5b6475';c.beginPath();c.arc(0,-138,22,.15,Math.PI-.15);c.fill();
  circ(-29,-96,5,'#d3242b'); // рана на рукаве
  if(o.medic){const p=.6+.4*Math.sin(t*8);c.globalAlpha=p;rr(-30,-190,34,34,7,'#e9eef5',INK,2);rect(-19,-183,12,20,'#e5262e');rect(-26,-176,26,6,'#e5262e');c.globalAlpha=1}
 })}
function stranger(x,y,s,a,lit,t){
 if(a<=0)return;
 c.save();c.globalAlpha=a;c.translate(x,y);c.scale(s,s);
 const sw=Math.sin(t*1.3)*2;
 const dark='#05060b';
 rr(-13,-100,11,100,5,dark);rr(3,-100,11,100,5,dark);                  // ноги
 // куртка: левая половина синяя, правая жёлтая
 const A=`rgba(35,88,232,${.12+lit*.88})`,B=`rgba(255,201,40,${.12+lit*.88})`;
 c.beginPath();c.roundRect(-26,-196,52,106,14);c.fillStyle=dark;c.fill();
 c.save();c.beginPath();c.roundRect(-26,-196,52,106,14);c.clip();c.fillStyle=A;c.fillRect(-26,-196,26,106);c.fillStyle=B;c.fillRect(0,-196,26,106);c.fillStyle=dark;c.globalAlpha=a*.35;c.fillRect(-26,-196,52,40);c.restore();
 c.globalAlpha=a;
 rr(-40+sw,-190,13,112,6,dark);rr(27-sw,-190,13,112,6,dark);               // длинные руки
 // голова чуть набок, без лица
 c.save();c.translate(0,-212);c.rotate(.22+Math.sin(t*.7)*.03);c.fillStyle=dark;c.beginPath();c.ellipse(0,0,19,24,0,0,7);c.fill();c.restore();
 c.restore()}

/* ---------- эффекты ---------- */
const fx={flash:0,fc:'#fff',kick:0,red:0,glitch:0,dark:0,lightning:0};
function kick(m){fx.kick=Math.max(fx.kick,m)}
function flash(col,a){fx.fc=col;fx.flash=Math.max(fx.flash,a)}
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
(()=>{const v=vig.getContext('2d');const g=v.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.78)');v.fillStyle=g;v.fillRect(0,0,W,H)})();
const gr=document.createElement('canvas');gr.width=gr.height=192;
(()=>{const v=gr.getContext('2d');const d=v.createImageData(192,192);for(let i=0;i<d.data.length;i+=4){const n=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=n;d.data[i+3]=60}v.putImageData(d,0,0)})();
const grPat=c.createPattern(gr,'repeat');

const rain=Array.from({length:150},()=>({x:R()*(W+200)-100,y:R()*H,sp:700+R()*500,l:14+R()*22}));
function drawRain(t,a){c.save();c.strokeStyle=`rgba(190,215,240,${a})`;c.lineWidth=1.5;c.beginPath();
 rain.forEach(d=>{const y=(d.y+t*d.sp)%(H+60)-30;const x=d.x-y*.18;c.moveTo(x,y);c.lineTo(x-d.l*.18,y+d.l)});c.stroke();c.restore()}
function bolt(x,a){c.save();c.globalAlpha=a;c.strokeStyle='#e6f0ff';c.lineWidth=5;c.lineJoin='round';c.beginPath();let px=x,py=0;c.moveTo(px,py);for(let i=0;i<9;i++){px+=(R()-.5)*60;py+=46+R()*20;c.lineTo(px,py)}c.stroke();c.restore()}

/* ================= ЗВУК ================= */
let ac=null,master,muff,bedBus,rev,noiseBuf,beds={},muted=false,audioOK=false;
function initAudio(){
 try{
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;
  muff=ac.createBiquadFilter();muff.type='lowpass';muff.frequency.value=20000;
  master=ac.createGain();master.gain.value=.9;
  master.connect(muff);muff.connect(comp);comp.connect(ac.destination);
  bedBus=ac.createGain();bedBus.gain.value=1;bedBus.connect(master);
  const len=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  // реверберация
  const il=ac.sampleRate*2.6,ib=ac.createBuffer(2,il,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const dd=ib.getChannelData(ch);for(let i=0;i<il;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/il,2.6)}
  rev=ac.createConvolver();rev.buffer=ib;const rg=ac.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(master);
  buildBeds();audioOK=true;
 }catch(e){audioOK=false}
}
function out(n,wet=.25,dry=1){const g=ac.createGain();g.gain.value=dry;n.connect(g);g.connect(master);if(wet){const w=ac.createGain();w.gain.value=wet;n.connect(w);w.connect(rev)}}
function nz(){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(0,Math.random()*1.5);return s}
function lfo(f,depth,param){const o=ac.createOscillator();o.frequency.value=f;const g=ac.createGain();g.gain.value=depth;o.connect(g);g.connect(param);o.start();return o}
function mkBed(name,src,filt){ // src → (filt) → level → bedBus
 const lv=ac.createGain();lv.gain.value=0;let n=src;if(filt){n.connect(filt);n=filt}n.connect(lv);lv.connect(bedBus);beds[name]={g:lv,v:0};return lv}
function buildBeds(){
 // тревожный дрон
 {const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;lfo(.08,60,lp.frequency);
  const m=ac.createGain();m.gain.value=.5;
  [[55,'sawtooth'],[55.9,'sawtooth'],[41.2,'sine'],[82.7,'triangle']].forEach(([f,t])=>{const o=ac.createOscillator();o.type=t;o.frequency.value=f;o.connect(m);o.start()});
  const hi=ac.createOscillator();hi.type='sine';hi.frequency.value=466;const hi2=ac.createOscillator();hi2.type='sine';hi2.frequency.value=493;
  const hg=ac.createGain();hg.gain.value=.012;lfo(5.5,.006,hg.gain);hi.connect(hg);hi2.connect(hg);hg.connect(m);hi.start();hi2.start();
  m.connect(lp);mkBed('drone',lp,null);const ref=beds.drone;ref.g.gain.value=0}
 // ветер

  const parts=[[-95,4,-8,'#3b4254'],[-60,-4,-20,'#cfd6e2'],[-20,-8,-38,'#3b4254'],[0,-20,-55,'#14442b'],[20,-8,-38,'#14442b'],[55,0,-20,'#14442b'],[88,6,-8,'#14442b'],[-40,-40,-62,'#14442b'],[40,-40,-62,'#14442b']];
  for(let i=0;i<Math.min(n,parts.length);i++){const [x,y,r,col]=parts[i];withT(x,y-60,i<4?-.55+i*.04:.55-(i-4)*.04,1,()=>{rr(-12,-70,24,100,9,col,INK,3)})}
  c.restore();
  if(T>=116.2){const a=sm((T-116.2)/.3);c.save();c.globalAlpha=a;c.translate(bx,by-170);c.strokeStyle='#3be07a';c.lineWidth=16;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(-30,0);c.lineTo(-8,26);c.lineTo(34,-24);c.stroke();c.restore();}}
 // фигурка под навесом
 if(T>=116.4)hero(455,560,.9,t);
 c.restore();
 drawRain(t,.35+.3*cl((t-4)/2));
 // молнии
 const L=[[106.5,70],[112,400],[117.5,300]];L.forEach(([a,x])=>{const d=T-a;if(d>=0&&d<.3){const al=d<.1?1:d<.17?.2:d<.24?.7:0;bolt(x,al);c.fillStyle=`rgba(220,235,255,${al*.45})`;c.fillRect(0,0,W,H)}});
}
function lerpC(a,b,k){return `rgb(${Math.round(lerp(a[0],b[0],k))},${Math.round(lerp(a[1],b[1],k))},${Math.round(lerp(a[2],b[2],k))})`}

function sNight(t){
 const T=t+122;
 const knockT=[132,133.3,134.6];
 const zoom=T>=135.6?1+sm((T-135.6)/9)*.55:1;
 c.save();
 c.translate(W/2+(T>=135.6?-70*sm((T-135.6)/9):0),H/2+(T>=135.6?30*sm((T-135.6)/9):0));c.scale(zoom,zoom);c.translate(-W/2,-H/2);

 circ(90,110,26,'#cfd8e8');circ(100,104,24,'#020409');
 jungle(t,250,800,1,'#03050a','#0d1a26');
 // кусты справа шевелятся
 const rus=T>=126.4&&T<131?1:0;for(let i=0;i<4;i++){c.fillStyle='#03070b';c.beginPath();c.ellipse(430+i*30+Math.sin(t*9+i)*rus*5,770+i*10,70,50,0,0,7);c.fill()}
 if(T>=129.4&&T<132){const al=sm((T-129.4)/.3);c.globalAlpha=al;[[400,790],[470,800]].forEach(([x,y])=>{glow(x,y,26,'rgba(255,160,60,.7)',1);circ(x-6,y,3,'#ffcf7a');circ(x+6,y,3,'#ffcf7a')});c.globalAlpha=1}
 // укрытие слева
 path([[20,860],[110,690],[200,860]],'#1a1f2a',INK,4);path([[20,860],[110,690],[110,860]],'rgba(255,170,80,.12)',null);
 // кольца от стуков
 knockT.forEach(k=>{const a=T-k;if(a>0&&a<.9){c.strokeStyle=`rgba(255,255,255,${.7*(1-a/.9)})`;c.lineWidth=3;c.beginPath();c.ellipse(430,600,20+a*170,14+a*110,0,0,7);c.stroke()}});
 // незнакомец
 const sa=sm((T-136)/3.2);let ss=1.6,sx=430,sy=860,lit=cl((T-139)/4)*.9;
 let jump=0;if(T>=145){jump=cl((T-145)/.14);ss=lerp(1.6,6.5,jump);sx=lerp(430,300,jump);sy=lerp(860,1500,jump);lit=1}
 if(T<145.6)stranger(sx,sy,ss,Math.min(1,sa*1),lit,t);
 // костёр и герой
 fire(250,860,1.3,t,1);
 const turn=T>=132;hero(190,900,1.5,t);
 if(turn&&T<145){c.save();c.globalAlpha=.9}
 if(turn&&T<145)c.restore();
 c.restore();
 // тёплый свет по краям
 glow(250,860,360,'rgba(255,120,40,.18)',1);
}

let T=0,playing=false,started=false,ci=0,last=0,nextVO=0;
const bar=document.getElementById('bar');
function sceneAt(t){return SCENES.find(s=>t>=s.a&&t<s.b)||SCENES[SCENES.length-1]}
function render(t){
 const s=sceneAt(t);
 c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
 c.save();
 const k=fx.kick;if(k>.2){c.translate((Math.random()-.5)*k,(Math.random()-.5)*k)}
 s.fn(t-s.a,s.b-s.a);
 c.restore();
 // глитч: сдвиг горизонтальных полос
 if(fx.glitch>.02){for(let i=0;i<7;i++){const y=Math.random()*H,h=10+Math.random()*60,dx=(Math.random()-.5)*60*fx.glitch;c.drawImage(cv,0,y*DPR,W*DPR,h*DPR,dx,y,W,h)}}
 drawRuleCard(t);
 drawCaption(t);
 // вспышки
 if(fx.flash>.01){c.fillStyle=fx.fc;c.globalAlpha=Math.min(1,fx.flash);c.fillRect(0,0,W,H);c.globalAlpha=1}
 // виньетка и зерно
 c.drawImage(vig,0,0,W,H);
 c.save();c.globalAlpha=.1;c.translate(Math.floor(Math.random()*192),Math.floor(Math.random()*192));c.fillStyle=grPat;c.fillRect(-192,-192,W+384,H+384);c.restore();
 // чёрный на входе в сцену
 if(s.fi){const a=t-s.a;if(a<s.fi){c.fillStyle=`rgba(0,0,0,${1-a/s.fi})`;c.fillRect(0,0,W,H)}}
 // конец ролика — затухание
 bar.style.width=(t/TOTAL*100)+'%';
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.1,(now-last)/1000);last=now;
 fx.flash*=.86;fx.kick*=.84;fx.glitch*=.88;
 if(playing){
  T+=dt;
  while(ci<CUES.length&&CUES[ci][0]<=T){try{CUES[ci][1]()}catch(e){}ci++}
  while(nextVO<VO.length&&VO[nextVO].t<=T){if(T-VO[nextVO].t<1.2)say(VO[nextVO]);nextVO++}
  audioTick();
  if(T>=TOTAL){playing=false;document.getElementById('pp').textContent='Смотреть снова';if('speechSynthesis' in window)speechSynthesis.cancel();if(audioOK)ZERO(1)}
 }
 render(Math.min(T,TOTAL-.001));
}
function start(){
 if(!started){started=true;initAudio()}
 if(ac&&ac.state==='suspended')ac.resume();
 document.getElementById('cover').hidden=true;playing=true;document.getElementById('pp').textContent='Пауза';
}
function restart(){
 if('speechSynthesis' in window)speechSynthesis.cancel();
 T=0;ci=0;nextVO=0;fx.flash=fx.kick=fx.glitch=0;
 if(audioOK){ZERO(.05);bedBus.gain.value=1;muffle(20000,.05)}
 start();
}
document.getElementById('go').onclick=restart;
document.getElementById('rs').onclick=restart;
document.getElementById('pp').onclick=()=>{
 if(T>=TOTAL){restart();return}
 if(!started){restart();return}
 playing=!playing;
 if(playing){if(ac)ac.resume();if('speechSynthesis' in window)speechSynthesis.resume();document.getElementById('pp').textContent='Пауза'}
 else{if(ac)ac.suspend();if('speechSynthesis' in window)speechSynthesis.pause();document.getElementById('pp').textContent='Продолжить'}
};
document.getElementById('vo').onclick=e=>{voiceOn=!voiceOn;e.target.textContent='Голос: '+(voiceOn?'вкл':'выкл');if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel()};

// отладка: ?t=секунды показывает кадр без звука
const q=new URLSearchParams(location.search).get('t');
if(q!==null){T=parseFloat(q)||0;document.getElementById('cover').hidden=true;fx.flash=0}
else{T=3.3} // постер: первый кадр с силуэтом
(document.fonts&&document.fonts.load?document.fonts.load('900 40px Rubik','Привет').catch(()=>{}):Promise.resolve()).then(()=>{last=performance.now();requestAnimationFrame(frame)});
</script>
